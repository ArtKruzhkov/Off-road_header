<div id="modal-1" aria-hidden="true" class="modal micromodal-slide">
    <div tabindex="-1" data-micromodal-close class="modal__overlay">
        <div role="dialog" aria-modal="true" aria-labelledby="modal-1-title" class="modal__container">

            <header class="modal__header">
                <h2 id="modal-1-title" class="modal__title">
                    Make a request
                </h2>

                <button aria-label="Close modal" data-micromodal-close class="modal__close"></button>
            </header>

            <form action="#">
                <main class="modal__content">
                    <input type="text" name="OR-Name" placeholder="Your name..." class="form-input modal__input">
                    <input type="tel" name="OR-Phone" placeholder="Your phone..."
                        class="form-input form-input-tel modal__input">
                    <textarea name="Message" placeholder="Your message..." class="form-input modal__input"></textarea>
                </main>
            </form>

            <footer class="modal__footer">
                <button class="button modal__btn-send"><span>Send</span></button>
            </footer>
        </div>
    </div>
</div>
